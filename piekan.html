<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排看小幫手</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }
    .box {
      background-color: #333;
      border: 2px solid #777;
      border-radius: 10px;
      padding: 15px 10px;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    /* 已看過的會變色 */
    .box.seen {
      background-color: #0f0;
      color: #000;
    }
    /* 房號文字 */
    .room-label {
      font-weight: bold;
      margin-bottom: 8px;
    }
    /* 備註文字改為紅色 */
    .note {
      font-size: 14px;
      color: red;
      word-wrap: break-word;
    }
    button {
      background-color: #444;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>排看小幫手</h1>
  <div class="grid" id="grid"></div>
  <button onclick="resetAll()">全部重置</button>

  <script>
    const grid = document.getElementById('grid');

    for (let i = 1; i <= 30; i++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.dataset.num = i;

      // 建立房號區塊 (僅保留號碼)
      const roomLabel = document.createElement('div');
      roomLabel.className = 'room-label';
      roomLabel.innerText = i;
      box.appendChild(roomLabel);

      // 建立備註區塊 (初始為空)
      const noteDiv = document.createElement('div');
      noteDiv.className = 'note';
      // 讀取 localStorage 裡的備註
      const storedNote = localStorage.getItem('note-' + i);
      if (storedNote) {
        noteDiv.innerText = storedNote;
      }
      box.appendChild(noteDiv);

      // 如果 localStorage 記錄該包廂為已看，加入 seen 樣式
      if (localStorage.getItem('box-' + i) === 'seen') {
        box.classList.add('seen');
      }

      // 點擊 (單擊) 切換已看狀態
      box.addEventListener('click', (event) => {
        // 為了避免雙擊時也觸發單擊，這裡用計時器判斷 (簡單處理)
        if (box.clickTimeout) return;
        box.clickTimeout = setTimeout(() => {
          box.classList.toggle('seen');
          if (box.classList.contains('seen')) {
            localStorage.setItem('box-' + i, 'seen');
          } else {
            localStorage.removeItem('box-' + i);
          }
          box.clickTimeout = null;
        }, 200);
      });

      // 雙擊進入備註輸入 (使用 dblclick 事件)
      box.addEventListener('dblclick', (event) => {
        // 若有計時器，則取消單擊事件
        if (box.clickTimeout) {
          clearTimeout(box.clickTimeout);
          box.clickTimeout = null;
        }
        // 讀取目前備註（若有）
        const currentNote = localStorage.getItem('note-' + i) || '';
        const newNote = prompt('請輸入備註：例如「常客」、「很喝」或名字', currentNote);
        if (newNote !== null) {
          localStorage.setItem('note-' + i, newNote);
          noteDiv.innerText = newNote;
        }
      });

      grid.appendChild(box);
    }

    // 清除所有紀錄：已看狀態與備註
    function resetAll() {
      if (confirm('確定要全部重置嗎？')) {
        for (let i = 1; i <= 30; i++) {
          localStorage.removeItem('box-' + i);
          localStorage.removeItem('note-' + i);
        }
        location.reload();
      }
    }
  </script>
</body>
</html>
